server:
  port: ${PORT:8888}
spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_BACKEND:native}
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
