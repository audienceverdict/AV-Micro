name: av-microservices
x-client-env: &client-env
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_USER: config
  CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Run scripts/setup-local.sh}
  EUREKA_URL: http://discovery:${EUREKA_PASSWORD:?Run scripts/setup-local.sh}@discovery-server:8761/eureka/
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Run scripts/setup-local.sh}
  CORS_ORIGINS: "${CORS_ORIGINS:-*}"
  SPRING_PROFILES_ACTIVE: dev
x-mail-env: &mail-env
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
services:
  mysql:
    image: mysql:8.4
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-local.sh}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deployment/mysql-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      # Require TCP readiness; the temporary initialization server only has a socket.
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute="SELECT 1" --silent >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  config-server:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args: { SERVICE: config-server }
    environment:
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    ports: ["127.0.0.1:8888:8888"]
    healthcheck: &java-health
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8888"']
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
  discovery-server:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args: { SERVICE: discovery-server }
    environment:
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
    ports: ["127.0.0.1:8761:8761"]
    healthcheck:
      <<: *java-health
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8761"']
  identity-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args: { SERVICE: identity-service }
    environment:
      <<: [*client-env, *mail-env]
      DB_URL: jdbc:mysql://mysql:3306/av_identity
      DB_USER: av_identity
      DB_PASSWORD: local-identity-password
      JWT_PRIVATE_KEY: file:/run/keys/identity-private.pem
      JWT_PUBLIC_KEY: file:/run/keys/identity-public.pem
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_MOBILE: ${APP_ADMIN_MOBILE:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-otp}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
    volumes:
      - ./secrets:/run/keys:ro
    depends_on:
      mysql: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
  av-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args: { SERVICE: av-service }
    environment:
      <<: [*client-env, *mail-env]
      DB_URL: jdbc:mysql://mysql:3306/av_business
      DB_USER: av_business
      DB_PASSWORD: local-business-password
      JWT_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
    depends_on:
      mysql: { condition: service_healthy }
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
  social-media-db-init:
    image: mysql:8.4
    entrypoint: [sh, /scripts/provision-social-media-db.sh]
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-local.sh}
    volumes:
      - ./scripts/provision-social-media-db.sh:/scripts/provision-social-media-db.sh:ro
    secrets: [social_media_db_password]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  social-media-service:
    build:
      context: .
      dockerfile: SocialMedia/Dockerfile
    ports: ["8085:8085"]
    environment:
      <<: *client-env
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888,configtree:/run/secrets/"
      SPRING_APPLICATION_NAME: social-media-service
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_USER:-config}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/social_media?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: social_media
      JWT_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/run/social/
      PUBLISHING_STORAGE_DIRECTORY: /app/data/publishing
      PUBLISHING_PUBLIC_BASE_URL: ${PUBLISHING_PUBLIC_BASE_URL:-}
      INSTAGRAM_PRIMARY_TOKEN: ${INSTAGRAM_PRIMARY_TOKEN:-}
      FACEBOOK_PAGE_TOKEN: ${FACEBOOK_PAGE_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      META_CLIENT_ID: ${META_CLIENT_ID:-}
      META_CLIENT_SECRET: ${META_CLIENT_SECRET:-}
    secrets:
      - source: social_media_db_password
        target: DB_PASSWORD
    volumes:
      - social-media-data:/app/data/publishing
      - ./secrets/social-media:/run/social:ro
    healthcheck:
      <<: *java-health
      test: [CMD-SHELL, 'bash -c "echo > /dev/tcp/127.0.0.1/8085"']
    depends_on:
      social-media-db-init: {condition: service_completed_successfully}
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      identity-service: {condition: service_started}
    restart: unless-stopped
  api-gateway:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args: { SERVICE: api-gateway }
    environment: *client-env
    ports: ["8080:8080"]
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      identity-service: { condition: service_started }
      av-service: { condition: service_started }
volumes:
  mysql-data:
  social-media-data:
secrets:
  social_media_db_password:
    file: ./secrets/social-media-db-password
