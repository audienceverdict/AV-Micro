eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery:${EUREKA_PASSWORD}@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    com.slokam.av: ${APP_LOG_LEVEL:INFO}
